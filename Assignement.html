<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Hover Image Preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Galerie d’images</h1>

    <!-- Zone d'affichage -->
    <div id="image">
        Hover over an image below to display here
    </div>

    <!-- Images -->
    <div class="gallery">
        <img src="https://picsum.photos/id/1015/300/200"
             alt="Montagne"
             onmouseover="upDate(this)"
             onmouseout="unDo()">

        <img src="https://picsum.photos/id/1025/300/200"
             alt="Chien"
             onmouseover="upDate(this)"
             onmouseout="unDo()">

        <img src="https://picsum.photos/id/1040/300/200"
             alt="Forêt"
             onmouseover="upDate(this)"
             onmouseout="unDo()">
    </div>

    <script src="script.js"></script>
</body>
</html>
